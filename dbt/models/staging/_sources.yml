version: 2

sources:
  - name: omop
    description: >
      Curated OMOP CDM v5.4 tables written as Parquet by the Glue ETL job and
      registered in the Glue Data Catalog. On the duckdb dev target, each
      table's external_location points at the committed sample_outputs/ CSVs
      (generated by the real pipeline via `make samples`), so the project runs
      with no AWS access.
    schema: "{{ 'vitalstream_db' if target.type == 'athena' else 'main' }}"
    tables:
      - name: person
        description: OMOP person table — one row per patient (FHIR Patient).
        meta:
          external_location: "read_csv_auto('../sample_outputs/person.csv')"
      - name: visit_occurrence
        description: OMOP visit_occurrence table — one row per encounter (FHIR Encounter).
        meta:
          external_location: "read_csv_auto('../sample_outputs/visit_occurrence.csv')"
      - name: measurement
        description: OMOP measurement table — one row per vital-sign observation (FHIR Observation).
        meta:
          external_location: "read_csv_auto('../sample_outputs/measurement.csv')"

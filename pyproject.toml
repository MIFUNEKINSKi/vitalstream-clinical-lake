[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalstream"
version = "1.0.0"
description = "Healthcare data pipeline: HL7 FHIR R4 to OMOP CDM v5.4"
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34.0",
    "faker>=22.0.0",
    "pyspark>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
